# Scenario A (median) — TS + Playwright + GitHub Actions project init.
# All expected skills exist in the agent-kit catalog. Cloudflare was
# dropped from the stack (no cloudflare skill remains in the repo).
id: skill-selector-init-typescript-001
name: TypeScript + Playwright + GitHub Actions project skill init
description: |
  User starting a new TS web app needs apm.yml init via skill-selector.
  Must run Phase 1 against the catalog and propose the critical skills
  tied to the stated signals.

tags:
  - typescript
  - playwright
  - github-actions
  - phase-1

inputs:
  prompt: |
    新規 TypeScript Web アプリを始める:
    - Node 24, bun でパッケージ管理
    - Vite + React frontend
    - Playwright for E2E
    - GitHub Actions for CI
    - 同じ repo から小さな npm utility を publish 予定 (eventually)

    "initialize this project's skill set — what should go into apm.yml?"

expected:
  output_contains:
    - "typescript"
    - "playwright-test"
    - "apm-usage"
  outcomes:
    - type: task_completed

graders:
  - name: phase1_first
    type: text
    config:
      regex_match:
        - "(?i)phase\\s*1|catalog\\s*(scan|row)"

  - name: critical_skills_literal
    type: code
    config:
      # Surface-literal check kept for regression sensitivity. Semantic
      # equivalence is judged by the `critical_skills_semantic` LLM grader
      # below.
      assertions:
        - "'typescript' in output"
        - "'playwright-test' in output"

  - name: pinning_mentioned
    type: text
    config:
      regex_match:
        - "(?i)pin.*(tag|sha)|apm\\s*view|--frozen"

  # Empirical-prompt-tuning: structured self-report from the executor.
  - name: self_report_complete
    type: self-report
    config:
      require_present: true
      require_all_phases_ok: true
      max_retries: 2

  # LLM-as-Judge: catches semantic equivalents (e.g. "apm view" implies
  # apm-usage knowledge) that surface-literal graders miss.
  - name: critical_skills_semantic
    type: llm
    config:
      rubric: |
        deliverable は次をすべて満たしているか?
        1. TypeScript 言語 skill (typescript) が提案されている
        2. Playwright E2E に対応する skill (playwright-test) が提案されている
        3. APM manifest 操作 skill (apm-usage) が提案されている、または `apm view` / `apm install` 等 APM 操作が言及され apm-usage を読む前提が暗黙にでも示されている
        4. project scope vs global scope の判断、もしくは「per-project の `apm.yml` を編集する」等の文言で scope が暗黙に示されている
        5. pinning (tag / SHA / `apm view` で resolve) について言及がある
        6. playwright-test / typescript の状態(✅ / 🔧 要カスタム)を提案時に示している、または要カスタムに触れている
        全 6 項を満たすときのみ PASS: yes。1 つでも欠けたら PASS: no。
