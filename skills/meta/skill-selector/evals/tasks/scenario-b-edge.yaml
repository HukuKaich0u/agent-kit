# Scenario B (edge) — Rust + SQL catalog + Go service + Buildkite CI.
# Tests that Phase 1:
# - selects the catalog rows that match (rust, sql-schema-audit)
# - handles off-catalog signals (Go service has no catalog row → Phase 2
#   rubric or explicit defer) without padding the install list
# - excludes gh-fix-ci for a non-GitHub-Actions CI (Buildkite)
id: skill-selector-edge-monorepo-001
name: Rust + SQL catalog + Go service + Buildkite monorepo
description: |
  Mid-stream monorepo with mixed signals; user names two pain points but
  also has off-catalog signals (Go service, Buildkite). Verifies the
  selector handles "no catalog match" without padding.

tags:
  - rust
  - sql
  - go
  - buildkite
  - phase-2

inputs:
  prompt: |
    monorepo に複数 stack:
    - Rust の主要サービス(`Cargo.toml`、`*.rs` 多数)
    - SQLite スキーマ + sqlc スタイルの `*.sql` query catalog
    - Go の補助 gRPC service
    - Buildkite-hosted CI (NOT GitHub Actions)

    Pain points:
    (a) Rust のレビューで所有権・async 周りの見落としが多い
    (b) PR ごとに SQLite の query plan が悪化していないか確かめたい

    "I want to add the right skills now. We don't have any installed yet."

expected:
  output_contains:
    - "rust"
    - "sql-plan-audit"
  outcomes:
    - type: task_completed

graders:
  - name: phase1_first
    type: text
    config:
      regex_match:
        - "(?i)phase\\s*1|catalog\\s*(scan|row)"

  - name: critical_skills_present
    type: code
    config:
      assertions:
        - "'rust' in output"
        - "'sql-plan-audit' in output"

  # gh-fix-ci の判定 (Buildkite なので install しない) は LLM judge
  # `edge_handling_semantic` 側でカバーする。code grader で or 連結 +
  # `output.lower()` のような Python idiom を表現するのが煩雑なため。

  - name: go_gracefully_handled
    type: text
    config:
      # Either Phase 2 escalation with rubric, or explicit non-adoption.
      regex_match:
        - "(?i)(phase\\s*2|skill-finder|search.*github|topic:claude-skill|no skill needed|defer)"

  - name: pinning_mentioned
    type: text
    config:
      regex_match:
        - "(?i)pin.*(tag|sha)|apm\\s*view|--frozen"

  # Empirical-prompt-tuning: structured self-report from the executor.
  - name: self_report_complete
    type: self-report
    config:
      require_present: true
      require_all_phases_ok: true
      max_retries: 2

  # LLM-as-Judge: catches semantic equivalents and the edge-specific
  # judgment (Buildkite signal handled correctly + Go escalation phrased
  # as Phase 2 rubric or explicit defer).
  - name: edge_handling_semantic
    type: llm
    config:
      rubric: |
        deliverable は次の 5 項目をすべて満たしているか?
        1. Rust レビュー痛点 (a) を `rust` skill で解決すると示している
        2. SQLite query plan 痛点 (b) を `sql-plan-audit` で解決すると示している
           (`sql-schema-audit` の併記は可)
        3. Go gRPC service について、catalog 不在を認識した上で次のいずれか:
           (a) Phase 2 escalation (`skill-finder`) の検索/評価ルーブリックを記述、または
           (b) 「near-term の recurring need ではない」と明示的に defer
        4. Buildkite CI signal について `gh-fix-ci` を install しない判断 (理由: GitHub Actions only) を明示
        5. project scope (per-repo `apm.yml`) を選び、pinning (tag/SHA、`apm view` で resolve) を言及
        全 5 項を満たすときのみ PASS: yes。1 つでも欠けたら PASS: no。
